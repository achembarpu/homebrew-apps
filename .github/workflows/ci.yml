name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: brew style (all casks and formulae)
        run: brew style Casks/*.rb Formula/*.rb

      - name: brew audit (changed casks and formulae)
        run: |
          set -euo pipefail
          brew tap achembarpu/tap "$PWD"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed_casks="$(ls Casks/*.rb 2>/dev/null || true)"
            changed_formulae="$(ls Formula/*.rb 2>/dev/null || true)"
          else
            changed_casks="$(git diff --name-only "$base" HEAD -- Casks 2>/dev/null || true)"
            changed_formulae="$(git diff --name-only "$base" HEAD -- Formula 2>/dev/null || true)"
          fi
          fail=0
          for f in $changed_casks; do
            name="$(basename "$f" .rb)"
            echo "==> brew audit --cask achembarpu/tap/$name"
            brew audit --cask "achembarpu/tap/$name" || fail=1
          done
          for f in $changed_formulae; do
            name="$(basename "$f" .rb)"
            echo "==> brew audit --formula achembarpu/tap/$name"
            brew audit --formula "achembarpu/tap/$name" || fail=1
          done
          exit $fail
